name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    # GitHub's `xcode-27` image (preview; macOS 27, Xcode 27.0–27.2, default 27.1). Checked on
    # 2026-10-25 against actions/runner-images. `macos-26` ships only Xcode 26.x. The OS 27 SDK
    # is needed while deploying to OS 26 (PRD M0).
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1 (matches the locally verified build, D-009)
        run: |
          XCODE=/Applications/Xcode_27.1.app
          if [ ! -d "$XCODE" ]; then
            echo "::error::Xcode 27.1 not found on this runner image."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Lint
        run: Tools/lint.sh

      - name: Lint self-test
        run: Tools/lint-selftest.sh

      - name: Swift package tests
        run: |
          for p in Packages/*/; do
            if [ -f "${p}Package.swift" ]; then
              echo "::group::swift test $p"
              swift test --package-path "$p"
              echo "::endgroup::"
            fi
          done

      - name: Generate Xcode project
        run: |
          if [ -f App/project.yml ]; then
            xcodegen generate --spec App/project.yml
          else
            echo "::notice::App/project.yml not present yet; skipping Xcode project generation and app tests."
          fi

      - name: App tests (macOS)
        run: |
          if [ -f App/project.yml ]; then
            xcodebuild -project App/Eagar.xcodeproj -scheme Eagar -testPlan Eagar \
              -destination 'platform=macOS' -derivedDataPath build/DerivedData CODE_SIGN_IDENTITY=- test
            # Every UI string is in the catalog with a ga scaffold (D-008)
            python3 Tools/sync-strings.py build/DerivedData --check
          else
            echo "::notice::Skipped: App/project.yml not present yet."
          fi

      - name: App tests (iOS Simulator)
        run: |
          if [ -f App/project.yml ]; then
            xcodebuild -project App/Eagar.xcodeproj -scheme Eagar -testPlan Eagar \
              -destination 'platform=iOS Simulator,name=iPhone 17' -derivedDataPath build/DerivedData CODE_SIGN_IDENTITY=- test
          else
            echo "::notice::Skipped: App/project.yml not present yet."
          fi

